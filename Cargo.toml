# The two Rust crates every series app shell depends on. Each repository pins
# them by git `rev` (a commit SHA, never a branch or tag); see README.md.
[workspace]
resolver = "2"
members = ["crates/itonami-series-host", "crates/itonami-series-build"]
# Scratch clones (bump-series.mjs --work, worker output) hold other crates.
exclude = [".agent-output"]
