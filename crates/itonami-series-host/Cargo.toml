[package]
name = "itonami-series-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
description = "Tauri v3 host for the Itonami classification-series apps: one read-only command"
repository = "https://github.com/cloud-itonami/itonami-lib"
publish = false
[dependencies]
# Must equal the app shell's own tauri pin: generate_context!() expands in the
# app crate, and both sides must be the same tauri.
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-wry = "=3.0.0-alpha.6"
serde_json = "1"
